<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <link rel="icon" type="image/png" href="./logos/logo-without-text.png">

    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css" />
  </head>


  <body>

                                <!-- HEADER -->
    <header>
      <div class="wrapper">
        <a href="index.html"
          ><img src="./logos/Fotogram-Logo.svg" alt="Fotogram Logo"
        /></a>
      </div>
    </header>

                               <!-- MAIN  -->
    <main class="wrapper">
      <h1>Your personal photo album</h1>

                                <!-- GALLERY -->
      <div id="gallery"></div>
      

                              <!-- POP-UP -->
      <dialog id="popup" tabindex="0">
        <div class="popup-content">
          
          <div class="picNameAndClose">
            <span id="popup_title"></span>
            <button id="closeBtn" type="button" >X</button>
          </div>

          <img id="popup_img" src="" alt="Large pic preview">
          
          <div class="arrows">
            <button class="arrows left" type="button"><img src="./logos/pfeil-links.png" alt="arrow links"></button>
            <span id="currentNumber">1/12</span>
            <button class="arrows right" type="button"><img src="./logos/pfeil-right.png" alt="arrow right"></button>
          </div>
        </div>

      </dialog>

    </main>


                          <!-- FOOTER -->
    <footer>
      <div class="footer-container">
        <a href="https://developerakademie.com/" target="_blank"
          ><img src="./logos/DevAkak-Logo.svg" alt="Developer Akademie Logo"
        /></a>
        <span>© 2023 Developer Akademie GmbH</span>
      </div>
    </footer>

    <script src="main.js"></script>
  </body>
</html>
