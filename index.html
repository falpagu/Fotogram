<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/png" href="./logos/logo-without-text.png" />

    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body>
    <!-- HEADER -->
    <header>
      <div class="wrapper">
        <a href="index.html"
          ><img src="./icons/Fotogram-Logo.svg" alt="Fotogram Logo"
        /></a>
      </div>
    </header>

    <!-- MAIN  -->
    <main class="wrapper">
      <h1>Your personal photo album</h1>

      <!-- GALLERY -->
      <div id="gallery"></div>

      <!-- POP-UP -->

      <dialog id="popUp" tabindex="0">
         
          <div class="popUp-content">
              <div class="picTitleAndCloseBtn">
                       <h3 id="picTitle"></h3>
                       <button id="closeBtn" type="button" onclick="closePopUp()">X</button>
              </div>

              <div class="popUp-img-container">  
                <img id="popUp-img" src="" alt="pics large view" />
              </div>
              
            <div id="arrows">
              <button id="arrowLeft" onclick="changePics()">
                <img src="./icons/pfeil-links.png" alt="arrow left" />
              </button>
              <span id="counter">1/12</span>
              <button id="arrowRight" onclick="changePics()">
                <img src="./icons/pfeil-right.png" alt="arrow right" />
              </button>
            </div>
          </div>
      
      </dialog>

    </main>

    <!-- FOOTER -->
    <footer>
      <div class="footer-container">
        <a href="https://developerakademie.com/" target="_blank"
          ><img src="./icons/DevAkak-Logo.svg" alt="Developer Akademie Logo"
        /></a>
        <span>© 2023 Developer Akademie GmbH</span>
      </div>
    </footer>

          <script src="script.js"></script>
  </body>
</html>
