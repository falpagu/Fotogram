<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fotogram</title>
    <link rel="stylesheet" href="style.css" />
    <script src="main.js" defer></script>
  </head>

  <body>
    <header>
      <div class="wrapper">
        <a href="index.html"
          ><img src="./Fotogram_Logos_/Fotogram_Logo.svg" alt="Fotogram Logo"
        /></a>
      </div>
    </header>



    <main class="wrapper">
      <h1>Your personal photo album</h1>

      <div id="gallery"></div>

      <dialog id="lightbox">
        <button id="close"><img src="./Fotogram_Logos_/x icon.svg" alt="close icon" srcset=""></button>
        <img id="dialog-img" alt="Large pic preview">
      </dialog>

    </main>



    <footer>
      <div class="footer-container">
        <a href="https://developerakademie.com/" target="_blank"
          ><img
            src="./Fotogram_Logos_/DevAkak Logo.svg"
            alt="Developer Akademie Logo"
        /></a>
        <span>© 2023 Developer Akademie GmbH</span>
      </div>
    </footer>
  </body>
</html>
